# The private project scheduler uses its own 256-bit Vault credential; it is not
# a browser endpoint. Other functions retain their existing JWT verification.
[functions.agent-hq-project-runner]
verify_jwt = false

# Fixed public research diagnostics use the same private Vault credential.
[functions.agent-hq-research-check]
verify_jwt = false


# Eleanor verifies owner sessions or the existing private scheduler credential in its handler.
[functions.agent-secretary]
verify_jwt = false
