name: Alex DNA guardrails

on:
  push:
    paths:
      - 'app.js'
      - 'agent-*-cloud.js'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'tests/alex-dna.test.mjs'
      - 'tests/unread-badges.test.mjs'
      - 'ios-ui.css'
      - 'index.html'
      - '.github/workflows/alex-dna-guardrails.yml'
  pull_request:
    paths:
      - 'app.js'
      - 'agent-*-cloud.js'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'tests/alex-dna.test.mjs'

permissions:
  contents: read

jobs:
  dna-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Alex role and approval boundaries
        run: node --test tests/alex-dna.test.mjs
      - name: Test unread message badges
        run: node --test tests/unread-badges.test.mjs
