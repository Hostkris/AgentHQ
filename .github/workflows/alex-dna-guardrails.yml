name: Alex DNA guardrails

on:
  push:
    paths:
      - 'app.js'
      - 'tests/account-signins-publishing.test.mjs'
      - 'agent-settings-integrations.css'
      - 'agent-settings-integrations.js'
      - 'theme.js'
      - 'agent-creative-desk.js'
      - 'tests/creative-desk.test.mjs'
      - 'agent-*-cloud.js'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'tests/alex-dna.test.mjs'
      - 'tests/unread-badges.test.mjs'
      - 'tests/messages-workflow.test.mjs'
      - 'tests/riley-dna.test.mjs'
      - 'ios-ui.css'
      - 'index.html'
      - '.github/workflows/alex-dna-guardrails.yml'
  pull_request:
    paths:
      - 'app.js'
      - 'tests/account-signins-publishing.test.mjs'
      - 'agent-settings-integrations.css'
      - 'agent-settings-integrations.js'
      - 'theme.js'
      - 'agent-creative-desk.js'
      - 'tests/creative-desk.test.mjs'
      - 'agent-*-cloud.js'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'tests/alex-dna.test.mjs'

permissions:
  contents: read

jobs:
  dna-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Alex role and approval boundaries
        run: node --test tests/alex-dna.test.mjs
      - name: Test unread message badges
        run: node --test tests/unread-badges.test.mjs
      - name: Test conversation-first manager workflow
        run: node --test tests/messages-workflow.test.mjs
      - name: Test Riley researcher-only DNA
        run: node --test tests/riley-dna.test.mjs
      - name: Test Creative Desk owner approvals and draft escaping
        run: node --test tests/creative-desk.test.mjs
      - name: Test account Settings and publishing opt-in
        run: node --test tests/account-signins-publishing.test.mjs
