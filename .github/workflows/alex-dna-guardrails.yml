permissions:
  contents: read

jobs:
  dna-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned PDF test library
        run: npm install --no-save --package-lock=false pdf-lib@1.17.1 @modelcontextprotocol/sdk@1.32.2 web-push@3.6.7
      - name: Test saved projects, real file outputs and workspace access
        run: node --test tests/project-workspace*.test.mjs tests/projects-app.test.mjs tests/chatgpt-handoff.test.mjs tests/chatgpt-app.test.mjs tests/secretary.test.mjs tests/secretary-snapshot.test.mjs tests/worker-instructions.test.mjs tests/consulting.test.mjs && node tests/chatgpt-handoff.protocol.mjs
      - name: Test Alex role and approval boundaries
        run: node --test tests/alex-dna.test.mjs
      - name: Test project response validation and recovery
        run: node --test tests/company-hq.test.mjs tests/project-response-recovery.test.mjs tests/project-autonomy.test.mjs
      - name: Test Groq public research and provider recovery
        run: node --test tests/research*.test.mjs tests/role-research.test.mjs
      - name: Test live activity and backend event authenticity
        run: node --test tests/activity-validation.test.mjs tests/execution-events.test.mjs tests/live-activity.test.mjs
      - name: Test unread message badges
        run: node --test tests/unread-badges.test.mjs
      - name: Test conversation-first manager workflow
        run: node --test tests/messages-workflow.test.mjs
      - name: Test Riley researcher-only DNA
        run: node --test tests/riley-dna.test.mjs
      - name: Test Maya essential marketing-strategy DNA
        run: node --test tests/maya-dna.test.mjs
      - name: Test Jordan creative director and scriptwriting DNA
        run: node --test tests/jordan-dna.test.mjs
      - name: Test Casey essential social media DNA
        run: node --test tests/casey-dna.test.mjs
      - name: Test Taylor essential communications DNA
        run: node --test tests/taylor-dna.test.mjs
      - name: Test Morgan essential Shopify DNA
        run: node --test tests/morgan-dna.test.mjs
      - name: Test Avery essential financial intelligence DNA
        run: node --test tests/avery-dna.test.mjs
      - name: Test Jamie essential scheduling DNA
        run: node --test tests/jamie-dna.test.mjs
      - name: Test Quinn essential strategic partnerships DNA
        run: node --test tests/quinn-dna.test.mjs
      - name: Test iPhone Home Screen and natural Messages
        run: node --test tests/ios-home-messages.test.mjs
      - name: Test camera, photo messages and private access
        run: node --check agent-camera-cloud.js && node --test tests/camera-messages.test.mjs
      - name: Verify Home Screen JavaScript syntax
        run: node --check agent-home-layout.js && node --check app.js && node --check agent-secretary.js && node --check agent-initiative-core.js && node --check agent-eleanor-initiatives.js && node --check agent-hq-autonomy-cloud.js && node --check agent-eleanor-goals.js && node --check agent-hq-goals-cloud.js && node --check agent-goal-math.js && node --check agent-eleanor-boards.js && node --check agent-eleanor-boards-data.js && node --check agent-hq-boards-cloud.js && node --check agent-eleanor-workflow.js && node --check agent-weather-conditions.js && node --check agent-reading-schedule.js && node --check agent-hq-notes-cloud.js && node --check agent-hq-checkin-cloud.js && node --test tests/eleanor-workflow.test.mjs tests/eleanor-reading-weather-dock.test.mjs tests/eleanor-goals.test.mjs tests/eleanor-boards.test.mjs tests/agent-initiative.test.mjs
      - name: Test Creative Desk owner approvals and draft escaping
        run: node --test tests/creative-desk.test.mjs
      - name: Test account Settings and publishing opt-in
        run: node --test tests/account-signins-publishing.test.mjs tests/automation-hub.test.mjs
      - name: Test approved knowledge, owner privacy and draft self-correction
        run: node --test tests/agent-intelligence.test.mjs && node --check agent-knowledge-cloud.js

  safari-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Safari engine for browser validation
        run: npm install --no-save --package-lock=false playwright@1.62.1 pdf-lib@1.17.1 pdfjs-dist@6.4.299 && npx playwright install --with-deps webkit
      - name: Verify Eleanor desk and privacy on iPhone and Mac
        run: node tests/secretary.browser.mjs && AGENTHQ_TEST_DEVICE=mac node tests/secretary.browser.mjs && node tests/chatgpt-app.browser.mjs && AGENTHQ_TEST_DEVICE=mac node tests/chatgpt-app.browser.mjs
      - name: Verify iPhone activity and collaboration
        env:
          AGENTHQ_TEST_BROWSER: webkit
        run: node tests/live-activity.browser.mjs && node tests/company-hq.browser.mjs && node tests/project-workspace.browser.mjs && node tests/projects-app.browser.mjs
      - name: Verify Mac activity and collaboration
        env:
          AGENTHQ_TEST_BROWSER: webkit
          AGENTHQ_TEST_DEVICE: mac
        run: node tests/live-activity.browser.mjs && node tests/company-hq.browser.mjs && node tests/projects-app.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: projects-app-previews
          path: |
            /tmp/agenthq-projects-browser
            /tmp/agenthq-secretary-browser
            /tmp/agenthq-chatgpt-app

  secretary-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify saved reminder ownership and invalidation
        run: node --test tests/secretary-snapshot.test.mjs
      - name: Install Safari engine for startup checks
        run: npm install --no-save --package-lock=false playwright@1.62.1 && npx playwright install --with-deps webkit
      - name: Verify immediate reminders on iPhone and desktop
        run: node tests/secretary-popup.browser.mjs && AGENTHQ_TEST_DEVICE=mac node tests/secretary-popup.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secretary-startup-previews
          path: /tmp/agenthq-secretary-browser

